<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatch lab</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  .lab-ui { position: fixed; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 5; font: 14px sans-serif; }
  .lab-ui button, .lab-ui select { font: inherit; padding: 6px 10px; border: 3px solid #3b2224; border-radius: 10px; background: #fdf3e4; }
  body.snap .lab-ui { display: none; }
</style></head>
<body>
<svg id="stage" viewBox="45 110 510 580" preserveAspectRatio="xMidYMid meet"></svg>
<div class="lab-ui">
  <select id="fx"></select>
  <select id="slow"><option value="1">1×</option><option value="3">⅓ speed</option><option value="4">¼ speed</option><option value="6">⅙ speed</option></select>
  <button id="go">Hatch</button>
</div>
<!-- Usage: tools/hatch-lab.html?fx=roll&slow=3&auto=1&snap=1&scene=forest&animal=fox -->
<script src="../js/util.js"></script>
<script src="../js/animals.js"></script>
<script src="../js/egg.js"></script>
<script src="../js/shellfx.js"></script>
<script src="../js/scenes.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/hatch/roll.js"></script>
<script src="../js/hatch/boom.js"></script>
<script src="../js/hatch/crumble.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('snap')) document.body.classList.add('snap');
  const fxSel = document.getElementById('fx'), slowSel = document.getElementById('slow');
  for (const f of [...GC.ShellFX.list(), GC.ShellFX.get('classic')]) fxSel.add(new Option(f.name, f.id));
  fxSel.value = q.get('fx') || fxSel.options[0].value;
  slowSel.value = q.get('slow') || '1';
  let egg;
  function reset() {
    const h = GC.Scenes.build(document.getElementById('stage'), q.get('scene') || 'forest');
    document.getElementById('stage').setAttribute('viewBox', '45 110 510 580');
    document.body.style.setProperty('--scene-bg', h.scene.bg);
    egg = new GC.Egg(h.eggLayer, { x: 300, y: 392 });
    egg.setStep(8, true);
    window.labDone = false;
  }
  window.labHatch = async function () {
    if (!egg || egg.hatched) reset();
    GC.timeScale = +slowSel.value || +q.get("slow") || 1;
    const a = GC.Animals.byId[q.get('animal') || 'fox'] || GC.Animals.list[0];
    window.labStart = performance.now();
    await egg.hatch(GC.Animals.render(a), { style: fxSel.value });
    window.labDone = true;
  };
  document.getElementById('go').onclick = () => { GC.Sound.ensure(); labHatch(); };
  reset();
  if (q.get('auto')) setTimeout(labHatch, 300);
</script>
</body></html>
