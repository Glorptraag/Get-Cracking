<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#5e6f55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Get Cracking">
  <meta name="description" content="A wordless visual timer for little ones: watch the egg crack as time passes, then meet the friend inside.">
  <title>Get Cracking</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- ============================================== SETUP ============ -->
  <section id="setup" class="screen active" aria-label="Set the timer">
    <svg class="setup-bg" aria-hidden="true"></svg>
    <div class="setup-scrim"></div>

    <div class="setup-inner">
      <h1 class="pill title-pill">Who's in the egg?</h1>

      <div class="timer-box">
        <!-- the egg-timer dial: twist the ring to set minutes -->
        <div class="dial-wrap">
          <svg class="dial" id="dial" viewBox="-170 -170 340 340" role="slider" tabindex="0"
               aria-label="Timer length" aria-valuemin="15" aria-valuemax="3600" aria-valuenow="300" aria-valuetext="5 minutes"></svg>
          <button class="step-btn step-minus" id="step-minus" aria-label="Less time" data-icon="minus"></button>
          <button class="step-btn step-plus" id="step-plus" aria-label="More time" data-icon="plus"></button>
        </div>
        <div class="presets" role="group" aria-label="Quick times, in minutes">
          <button data-min="1">1</button><button data-min="2">2</button><button data-min="5">5</button>
          <button data-min="10">10</button><button data-min="15">15</button><button data-min="30">30</button>
        </div>
      </div>

      <button class="start-btn" id="start-btn">
        <svg class="start-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M15 9.5 C15 7.5 17 6.5 18.7 7.5 L39 21.5 C40.6 22.6 40.6 25.4 39 26.5 L18.7 40.5 C17 41.5 15 40.5 15 38.5 Z"/></svg>
        <span class="start-label">Start</span>
      </button>

      <label class="toggle-row setup-toggle">
        <input type="checkbox" id="quick-tap">
        <span class="switch" aria-hidden="true"></span>
        <span class="toggle-text" id="quick-tap-text">Hatch waits for a tap</span>
      </label>

      <nav class="quick-icons" aria-label="Options">
        <button class="icon-btn" id="btn-world" aria-label="Choose world"><span class="ico" data-icon="tree"></span><small>World</small></button>
        <button class="icon-btn" id="btn-sound" aria-label="Choose music"><span class="ico" data-icon="notes"></span><small>Music</small></button>
        <button class="icon-btn" id="btn-book" aria-label="Friend book"><span class="ico" data-icon="book"></span><small>Friends</small></button>
        <button class="icon-btn" id="btn-settings" aria-label="Grown-up settings"><span class="ico" data-icon="gear"></span><small>Settings</small></button>
      </nav>
    </div>
  </section>

  <!-- ============================================== TIMER ============ -->
  <section id="timer" class="screen" aria-label="Timer">
    <svg class="stage" id="stage" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>

    <div class="pill hatch-pill" id="hatch-pill" aria-live="polite"></div>
    <div class="pill time-pill" id="time-pill" aria-hidden="true">5:00</div>
    <div class="tap-hint" id="tap-hint" aria-hidden="true" data-icon="tap"></div>

    <div class="next-card" id="next-card" aria-live="polite">
      <div class="next-icon" id="next-icon" data-icon="teddy"></div>
      <div><small>Next up</small><strong id="next-text">Tidy-up time</strong></div>
    </div>

    <!-- grown-up lock: hold to open the parent tray -->
    <button class="lock-btn" id="lock-btn" aria-label="Grown-ups: hold to open controls">
      <svg viewBox="0 0 48 48" class="hold-ring" aria-hidden="true"><circle cx="24" cy="24" r="21" pathLength="1"/></svg>
      <span class="lock-ico" data-icon="lock"></span>
    </button>
    <div class="lock-tip" id="lock-tip">Grown-ups: press &amp; hold</div>

    <div class="kid-controls" id="kid-controls">
      <button class="round-btn" id="kc-minus" aria-label="One minute less">−1</button>
      <button class="round-btn" id="kc-plus" aria-label="One minute more">+1</button>
      <button class="round-btn" id="kc-pause" aria-label="Pause" data-icon="pause"></button>
    </div>

    <button class="hold-btn" id="again-btn" aria-label="Hold for a new egg">
      <span data-icon="egg"></span><b>Hold for a new egg</b>
    </button>

    <div class="tray" id="tray" role="dialog" aria-label="Grown-up controls">
      <div class="tray-title">Grown-up controls</div>
      <div class="tray-btns">
        <button data-act="pause"><span data-icon="pause"></span>Pause</button>
        <button data-act="minus"><span>−1</span>Minute</button>
        <button data-act="plus"><span>+1</span>Minute</button>
        <button data-act="hatch"><span data-icon="hatch"></span>Hatch now</button>
        <button data-act="again"><span data-icon="again"></span>New egg</button>
        <button data-act="stop" class="danger"><span data-icon="stop"></span>Stop</button>
      </div>
      <button class="tray-close" data-act="close" aria-label="Close" data-icon="close"></button>
    </div>
  </section>

  <!-- ============================================== SHEETS =========== -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title">Settings</h2><button class="sheet-close" id="sheet-close" aria-label="Close" data-icon="close"></button></header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <noscript><p class="noscript">Get Cracking needs JavaScript to hatch eggs.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/egg.js"></script>
  <script src="js/shellfx.js"></script>
  <script src="js/hatch/roll.js"></script>
  <script src="js/hatch/boom.js"></script>
  <script src="js/hatch/crumble.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
