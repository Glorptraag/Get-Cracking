<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#5e6f55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Get Cracking">
  <meta name="description" content="A wordless visual timer for little ones: watch the egg crack as time passes, then meet the friend inside.">
  <title>Get Cracking</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- ============================================== SETUP ============ -->
  <section id="setup" class="screen active" aria-label="Set the timer">
    <svg class="setup-bg" aria-hidden="true"></svg>
    <div class="setup-scrim"></div>

    <div class="setup-inner">
      <h1 class="pill title-pill">Who's in the egg?</h1>

      <div class="timer-box">
        <div class="perch" aria-hidden="true">
          <svg class="perch-egg" viewBox="-110 -205 220 225"></svg>
        </div>
        <div class="sprout sprout-tl" aria-hidden="true"></div>
        <div class="sprout sprout-tr" aria-hidden="true"></div>
        <div class="sprout sprout-br" aria-hidden="true"></div>

        <div class="dials">
          <button class="dial" id="dial-min" aria-label="Minutes"><span>05</span></button>
          <div class="colon" aria-hidden="true"><i></i><i></i></div>
          <button class="dial" id="dial-sec" aria-label="Seconds — tap to change"><span>00</span></button>
        </div>
        <div class="label-tag" id="min-label">minutes</div>
        <input type="range" id="min-slider" min="0" max="60" step="1" value="5" aria-label="Minutes">
        <div class="presets" role="group" aria-label="Quick times">
          <button data-min="1">1</button><button data-min="2">2</button><button data-min="5">5</button>
          <button data-min="10">10</button><button data-min="15">15</button><button data-min="20">20</button><button data-min="30">30</button>
        </div>
        <div class="box-feet" aria-hidden="true"><i></i><i></i></div>
      </div>

      <label class="toggle-row">
        <input type="checkbox" id="quick-tap">
        <span class="switch" aria-hidden="true"></span>
        <span class="toggle-text" id="quick-tap-text">Hatch waits for a tap</span>
      </label>

      <button class="planter" id="start-btn">
        <span class="planter-sprouts" aria-hidden="true"><i></i><i></i></span>
        <span class="planter-label">Start</span>
      </button>

      <nav class="quick-icons" aria-label="Options">
        <button class="icon-btn" id="btn-world" aria-label="Choose world"><span class="ico">🌳</span><small>World</small></button>
        <button class="icon-btn" id="btn-sound" aria-label="Choose music"><span class="ico">🎶</span><small>Music</small></button>
        <button class="icon-btn" id="btn-book" aria-label="Friend book"><span class="ico">📖</span><small>Friends</small></button>
        <button class="icon-btn" id="btn-settings" aria-label="Grown-up settings"><span class="ico">⚙️</span><small>Settings</small></button>
      </nav>
    </div>
  </section>

  <!-- ============================================== TIMER ============ -->
  <section id="timer" class="screen" aria-label="Timer">
    <svg class="stage" id="stage" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>

    <div class="pill hatch-pill" id="hatch-pill" aria-live="polite"></div>
    <div class="pill time-pill" id="time-pill" aria-hidden="true">5:00</div>
    <div class="tap-hint" id="tap-hint" aria-hidden="true">👆</div>

    <div class="next-card" id="next-card" aria-live="polite">
      <div class="next-icon" id="next-icon">🧸</div>
      <div><small>Next up</small><strong id="next-text">Tidy-up time</strong></div>
    </div>

    <!-- grown-up lock: hold to open the parent tray -->
    <button class="lock-btn" id="lock-btn" aria-label="Grown-ups: hold to open controls">
      <svg viewBox="0 0 48 48" class="hold-ring" aria-hidden="true"><circle cx="24" cy="24" r="21" pathLength="1"/></svg>
      <span>🔒</span>
    </button>
    <div class="lock-tip" id="lock-tip">Grown-ups: press &amp; hold</div>

    <div class="kid-controls" id="kid-controls">
      <button class="round-btn" id="kc-minus" aria-label="One minute less">−1</button>
      <button class="round-btn" id="kc-plus" aria-label="One minute more">+1</button>
      <button class="round-btn" id="kc-pause" aria-label="Pause">❚❚</button>
    </div>

    <button class="hold-btn" id="again-btn" aria-label="Hold for a new egg">
      <svg viewBox="0 0 48 48" class="hold-ring" aria-hidden="true"><circle cx="24" cy="24" r="21" pathLength="1"/></svg>
      <span>🥚</span><b>Hold for a new egg</b>
    </button>

    <div class="tray" id="tray" role="dialog" aria-label="Grown-up controls">
      <div class="tray-title">Grown-up controls</div>
      <div class="tray-btns">
        <button data-act="pause"><span>❚❚</span>Pause</button>
        <button data-act="minus"><span>−1</span>Minute</button>
        <button data-act="plus"><span>+1</span>Minute</button>
        <button data-act="hatch"><span>🐣</span>Hatch now</button>
        <button data-act="again"><span>🔁</span>New egg</button>
        <button data-act="stop" class="danger"><span>■</span>Stop</button>
      </div>
      <button class="tray-close" data-act="close" aria-label="Close">✕</button>
    </div>
  </section>

  <!-- ============================================== SHEETS =========== -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title">Settings</h2><button class="sheet-close" id="sheet-close" aria-label="Close">✕</button></header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <noscript><p class="noscript">Get Cracking needs JavaScript to hatch eggs.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/egg.js"></script>
  <script src="js/shellfx.js"></script>
  <script src="js/hatch/roll.js"></script>
  <script src="js/hatch/boom.js"></script>
  <script src="js/hatch/crumble.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
