name: Advent Eggs build

on:
  push:
    paths:
      - "AdventEggs/**"
      - ".github/workflows/advent-eggs-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project AdventEggs/AdventEggs.xcodeproj -target AdventEggs \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60 || true
