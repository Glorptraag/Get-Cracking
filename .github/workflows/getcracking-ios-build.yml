name: Get Cracking iOS build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Checks and simulator build (tools/check.sh)
        env:
          CHECK_OUT: ${{ github.workspace }}/check-out
        run: tools/check.sh
      - name: Upload the contact sheets (packs, egg steps, icons)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-art
          path: check-out/art-png
          if-no-files-found: ignore
      - name: Errors
        if: failure()
        run: grep -E "error:" check-out/build.log | sort -u | head -60 || true
