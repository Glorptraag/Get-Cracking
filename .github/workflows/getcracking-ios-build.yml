name: Get Cracking iOS build
on:
  push:
    paths: ["GetCracking/**", "GetCracking.xcodeproj/**", "Config/**", "Tests/**", ".github/workflows/getcracking-ios-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Gate checks (The Whole Nest decisions, no StoreKit)
        run: |
          swiftc GetCracking/Monetization/Packs.swift GetCracking/Monetization/FeatureGate.swift \
            Tests/GateChecks/main.swift -o gatecheck
          ./gatecheck
      - name: Art checks (pack friends and worlds drawn with CoreGraphics on macOS)
        run: |
          swiftc GetCracking/Core/VNode.swift GetCracking/Core/SVGPath.swift GetCracking/Core/Motion.swift GetCracking/Core/Util.swift \
            GetCracking/Art/Animals.swift GetCracking/Art/Loops.swift GetCracking/Art/Props.swift GetCracking/Art/Scenes.swift \
            GetCracking/Art/Packs/*.swift GetCracking/Monetization/Packs.swift Tests/ArtChecks/*.swift -o artcheck
          ./artcheck art-png
      - name: Compare with the web drawings (TEMPORARY diagnostic)
        if: ${{ !cancelled() }}
        run: |
          git fetch --depth=1 origin claude/epic-hypatia-3w52rk
          W=Tests/ArtChecks/WebDiff
          mkdir -p $W/js/packs webref
          for f in util animals scenes packs packs/aussie packs/christmas; do git show FETCH_HEAD:js/$f.js > $W/js/$f.js; done
          CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          for f in art-png/friend-*.png art-png/world-*.png; do
            n=$(basename $f .png); kind=${n%%-*}; id=${n#*-}
            if [ $kind = friend ]; then size=600,540; else size=600,720; fi
            "$CH" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=$size \
              --screenshot=webref/$n.png "file://$PWD/$W/ref.html#$kind=$id" >/dev/null 2>&1 || echo "no web render for $n"
          done
          python3 -m venv /tmp/v && /tmp/v/bin/pip -q install pillow
          /tmp/v/bin/python $W/diff.py art-png webref
      - name: Upload the pack contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-art
          path: art-png
          if-no-files-found: ignore
      - name: Build for the iOS Simulator
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project GetCracking.xcodeproj -target GetCracking \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60 || true
