name: Get Cracking iOS build
on:
  push:
    paths: ["GetCracking/**", "GetCracking.xcodeproj/**", "Config/**", "Tests/**", ".github/workflows/getcracking-ios-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Gate checks (The Whole Nest decisions, no StoreKit)
        run: |
          swiftc GetCracking/Monetization/Packs.swift GetCracking/Monetization/FeatureGate.swift \
            Tests/GateChecks/main.swift -o gatecheck
          ./gatecheck
      - name: Art checks (pack friends and worlds drawn with CoreGraphics on macOS)
        run: |
          swiftc GetCracking/Core/VNode.swift GetCracking/Core/SVGPath.swift GetCracking/Core/Motion.swift GetCracking/Core/Util.swift \
            GetCracking/Art/Animals.swift GetCracking/Art/Loops.swift GetCracking/Art/Props.swift GetCracking/Art/Scenes.swift \
            GetCracking/Art/Packs/*.swift GetCracking/Monetization/Packs.swift Tests/ArtChecks/*.swift -o artcheck
          ./artcheck art-png
      - name: Upload the pack contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-art
          path: art-png
          if-no-files-found: ignore
      - name: Build for the iOS Simulator
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project GetCracking.xcodeproj -target GetCracking \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60 || true
